name: Deploy Shui to S3

on:
    push:
        branaches:
            - main

permissions:
    id-token: write
    contents: read

    jobs:
        deploy:
            runs-on: ubutnu-latest
            steps:
                - name: Checkout repository
                  uses: actions/checkout@v4

                - name: Setup Node.js
                  uses: actions/setup-node@v4
                  with:
                      node-version: 22

                - name: Install dependencies
                  run: npm ci

                - name: Build application
                  run: npm run build

                - name: Configure AWS credentials
                  uses: aws-actions/configure-aws-credentials@v5
                  with:
                      role-to-assume: arn:aws:iam::337058059317:role/FrontendS3DeployRole
                      aws-region: eu-north-1

                - name: Deploy to S3
                  run: aws s3 sync dist/ s3://shui-frontend-jonathan --delete
