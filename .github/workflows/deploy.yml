name: Deploy Shui to S3

on:
    push:
        branaches:
            - main
        paths:
            - "frontend/**"

permissions:
    id-token: write
    contents: read

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: "npm"
                  cache-dependency-path: frontend/package-lock.json

            - name: Install dependencies
              working-directory: ./frontend
              run: npm ci

            - name: Build application
              working-directory: ./frontend
              run: npm run build

            - name: Configure AWS credentials
              uses: aws-actions/configure-aws-credentials@v5
              with:
                  role-to-assume: arn:aws:iam::337058059317:role/FrontendS3DeployRole
                  aws-region: eu-north-1

            - name: Deploy to S3
              working-directory: ./frontend
              run: aws s3 sync dist/ s3://shui-frontend-jonathan --delete
